<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FastAPI Homework 3 - Dashboard</title>
  https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    /FastAPI Homework 3</a>
    <div class="navbar-nav">
      /dashboard
      /logout
    </div>
  </div>
</nav>

<div class="container mt-4">

  {% if request.query_params.expired %}
  <div class="alert alert-warning">
    Your session expired or you tried to access a protected page without logging in.
  </div>
  {% endif %}

  <div class="card">
    <div class="card-body">
      <h3 class="card-title">Dashboard</h3>
      <p class="card-text">Welcome, <strong>{{ user }}</strong>!</p>

      /logout
      /
    </div>
  </div>
</div>

</body>
</html>
