# HW9 Part 3.1 - labeled semantic-cache test set (Shashank Ranjan, PREFIX s2837)
# Domain: local restaurant inspections. Restaurants = the ten S2837-H9-* records in s2837_rel.
#
# Protocol: the cache is warmed with every non-null cached_query (30 entries, each stored with
# the HW8 agent's answer). Each `query` is then looked up against that whole cache.
#   expected: hit  -> the correct outcome is a hit on THIS case's cached_query
#   expected: miss -> any hit is a false hit (the cached answer is wrong for the query)
#
# Labels were written before any threshold sweep and are NOT edited afterwards.
# Labeling mistakes found later are documented in cache_cases_errata.md instead.
version: 1
created: "2026-11-06"
