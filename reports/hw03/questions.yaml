- id: q1
  question: "What are the required daily cleaning tasks for restaurant food preparation areas?"
  expected_answer: "Daily cleaning tasks include sanitizing all food preparation surfaces, cleaning cutting boards, disposing of waste, and ensuring floors and drains are cleaned according to county sanitation standards."
  expected_source: "restaurant_kitchen_sanitation.txt"

- id: q2
  question: "What indicators suggest pest infestation in a restaurant kitchen?"
  expected_answer: "Indicators of pest infestation include droppings, damaged food packaging, visible insects near drains, and signs of rodents in storage or waste areas."
  expected_source: "pest_control_requirements.txt"

- id: q3
  question: "What hygiene practices must staff follow when handling ready-to-eat foods?"
  expected_answer: "Staff must wash hands frequently, use gloves for ready-to-eat foods, avoid cross-contamination, and follow hygiene training procedures mandated by the county."
  expected_source: "hygiene_training_manual.txt"

- id: q4
  question: "Under what conditions should a restaurant be temporarily closed due to sanitation issues?"
  expected_answer: "A temporary closure is required when critical violations occur such as sewage backup, presence of live rodents, failure in waste disposal systems, or lack of potable water."
  expected_source: "county_restaurant_cleaning_standards.txt"

- id: q5
  question: "What signs indicate stale or unsafe food in a restaurant display case?"
  expected_answer: "Unsafe food indicators include discoloration, dryness or cracking of sweets, off-smells, condensation inside display glass, or exposure to air without proper covering."
  expected_source: "restaurant_inspection_report_1.txt"